plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.cleanyourtv.partymode'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.cleanyourtv.partymode'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: signed with the debug key, like the launcher.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No libraries in the APK.
}
