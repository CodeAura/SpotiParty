# The website (spotiparty.netlify.app) is a Vite + React app in site/: GSAP + ScrollTrigger, Lenis and React Bits.
# Netlify builds it from site/ and publishes site/dist.
[build]
  base = "site"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Long cache for the hashed bundle files; the images keep their names, so a shorter cache for those.
[[headers]]
  for = "/assets/index-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
