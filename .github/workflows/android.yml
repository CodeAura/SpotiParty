# Builds the Android TV apps (SpotiParty and Lyrics) to check they compile; the APKs appear under the run's
# Artifacts. Both are signed with this run's debug key: install them together, or build your own (docs: Android TV).
name: Android TV apps

on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build SpotiParty
        working-directory: android/party-mode
        run: ./gradlew --no-daemon assembleRelease
      - name: Build Lyrics
        working-directory: android/lyrics
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SpotiParty-android-tv
          path: android/*/app/build/outputs/apk/release/*.apk
